name: Build desktop apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            label: windows-x64
          - os: macos-latest
            architecture: arm64
            label: macos-arm64
          - os: macos-15-intel
            architecture: x64
            label: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install build and test dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build native JPEG helper, test UI, package and verify the app
        run: python build_desktop.py --label ${{ matrix.label }} --output dist/desktop
      - name: Upload portable desktop build and checksums
        uses: actions/upload-artifact@v7.0.2
        with:
          name: desktop-${{ matrix.label }}
          path: dist/desktop/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
