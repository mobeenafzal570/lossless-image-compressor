name: Lossless compression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      REQUIRE_DECODER_TESTS: '1'
      REQUIRE_GUI_TESTS: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install independent test decoder
        run: python -m pip install -r requirements-dev.txt -r requirements-gui.txt
      - name: Install lossless JPEG backend for Linux integration checks
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-turbo-progs
          echo 'JPEGTRAN_BIN=/usr/bin/jpegtran' >> "$GITHUB_ENV"
      - name: Run format, filesystem, and independent pixel checks
        run: python -m unittest -v
      - name: Verify documented command-line entry point
        run: python compress_images.py --help
